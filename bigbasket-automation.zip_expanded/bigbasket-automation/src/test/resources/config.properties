# ---- Application ----
base.url=https://www.bigbasket.com/

# ---- Browser (override from CLI: -Dbrowser=firefox -Dheadless=true) ----
browser=chrome
headless=false

# ---- Timeouts (seconds) ----
explicit.wait=20
page.load.timeout=60
short.wait=5

# ---- Validation thresholds ----
# % of filtered products whose name must contain the selected brand
filter.min.match.percent=70
# tolerance for money comparisons
price.tolerance=0.01
# max number of top results from which a product is randomly picked
random.pick.pool=8

# ---- Reports ----
report.dir=target/reports
screenshot.dir=target/screenshots
